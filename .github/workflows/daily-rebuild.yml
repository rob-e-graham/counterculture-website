name: Daily rebuild

# The next show is derived from the date, so a static build goes stale as the
# week turns. A nightly rebuild keeps the served HTML correct for crawlers and
# anyone with JS off; NextShowLive covers everyone else instantly.
on:
  schedule:
    - cron: "31 16 * * *" # 02:31 Melbourne
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  rebuild:
    uses: ./.github/workflows/deploy.yml
