name: Sync roster from sheet

# Pulls the crew Google Sheet into src/data/roster.ts and commits any change.
# A commit to main triggers the deploy workflow, so the front page updates on
# its own without anyone touching the repo.
# Paused. The crew sheet is not ready, and while it holds internal first names
# rather than stage names it must not drive the public site. Bookings are set
# from /tools for now. Re-enable the schedule when the sheet is trusted.
on:
  workflow_dispatch:

permissions:
  contents: write
  # Dispatching the deploy workflow needs actions:write. Without it the sync
  # commits fine and then fails with HTTP 403, so the show never goes live.
  actions: write

concurrency:
  group: sync-roster
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync roster from the sheet
        run: node tools/sync-roster.mjs

      - name: Verify the generated file builds
        run: |
          npm ci
          npm run build

      - name: Commit if the roster changed
        id: commit
        run: |
          if git diff --quiet -- src/data/roster-data.ts; then
            echo "Roster unchanged — nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "counterculture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/roster-data.ts
          git commit -m "Sync roster from the crew sheet"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # deploy has to be asked for explicitly or the sync never reaches the site.
      - name: Trigger the deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
